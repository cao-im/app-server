server:
  port: 8081
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cao_im_app_server?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: rootlocal

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# IM 服务配置
im:
  server:
    # IM核心服务地址（请根据实际部署的IM服务端口修改）
    url: http://localhost:8080/api

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.caoim.appserver.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: CaoImSecretKey2024!@#$%ForJWTTokenGenerationAndValidation
  expiration: 604800000
  refresh-expiration: 604800000
  header: Authorization
  prefix: Bearer

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html  # SpringDoc 2.x 标准路径
    enabled: true

# API 日志配置
api-log:
  enabled: true
  log-headers: true
  log-params: true
  log-body: true
  log-response: true
  max-body-length: 2000
  exclude-paths:
    - /swagger-ui
    - /v3/api-docs
    - /api-docs
    - /static
    - /favicon

# 日志级别配置 (开发环境Debug模式)
logging:
  level:
    com.caoim.imcore.config.ApiLogFilter: DEBUG
    org.springframework.web.filter: DEBUG

# 文件上传配置
file:
  # 存储类型：local-本地存储, cos-腾讯云COS, oss-阿里云OSS
  type: local
  # 本地存储根路径
  local-path: E:/ProjectsCode/clb_projects/cao_im/app-server/target/caoim-files
  # 文件访问域名前缀（用于拼接完整URL，本地开发用IP，部署时改为实际域名）
  domain: http://127.0.0.1:8081
  # 单文件最大大小（默认10MB）
  max-size: 10MB
  # 允许上传的文件扩展名（白名单）
  allowed-extensions:
    - jpg
    - jpeg
    - png
    - gif
    - bmp
    - webp
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - ppt
    - pptx
    - txt
    - md
    - zip
    - rar
    - mp3
    - mp4
    - avi
    - mov
  # 是否按日期分子目录存储（yyyy/MM/dd）
  date-path: true
  # 静态资源访问路径前缀
  prefix: /profile
